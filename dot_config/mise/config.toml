[settings]
auto_update = true
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
jobs = 4
lockfile = true

[tools]
age = "latest"
"aqua:fish-shell/fish-shell" = "latest"
"aqua:tmux/tmux-builds" = "latest"
bat = "latest"
btop = "latest"
chezmoi = "latest"
delta = "latest"
deno = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:io12/pwninit" = { version = "latest", asset_pattern = "pwninit" }
"github:llvm/llvm-project" = { version = "latest", version_prefix = "llvmorg-", asset_pattern = "LLVM-*-Linux-X64.tar.xz", bin_path = "LLVM-{{ version }}-Linux-X64/bin" }
"github:NixOS/patchelf" = "latest"
lsd = "latest"
lua-language-server = "latest"
neovim = "latest"
node = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:pyright" = "latest"
"pipx:podman-compose" = "latest"
ripgrep = "latest"
rtk = "latest"
ruff = "latest"
rust = { version = "stable", profile = "default", components = ["rust-analyzer", "rust-src"] }
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tree-sitter = "latest"
uv = "latest"
zig = "latest"
zls = "latest"
