[[plugins]]
repo = "nvim-tree/nvim-web-devicons"

[[plugins]]
repo = "folke/flash.nvim"
on_lua = "flash"
lua_add = '''
    vim.keymap.set({ "n", "x", "o" }, "s", function() require("flash").jump() end, { silent = true, desc = "Flash" })
    -- dpp's key replay breaks the first operator-pending motion; call Flash directly.
    for _, key in ipairs({ "f", "F", "t", "T", ";", "," }) do
        vim.keymap.set({ "n", "x", "o" }, key, function()
            require("flash")
            vim.fn.maparg(key, "n", false, true).callback()
        end, { silent = true })
    end
'''
lua_source = '''
    -- Flash preserves existing repeat mappings; remove our loading callbacks first.
    vim.keymap.del({ "n", "x", "o" }, ";")
    vim.keymap.del({ "n", "x", "o" }, ",")
    require("flash").setup({})
'''

[[plugins]]
repo = "windwp/nvim-autopairs"
on_event = "InsertEnter"
lua_source = '''
    require("nvim-autopairs").setup({
        check_ts = true,
    })
'''

[[plugins]]
repo = "hiphish/rainbow-delimiters.nvim"
on_event = "FileType"
on_if = "&buftype ==# '' && &filetype !=# 'text'"

[[plugins]]
repo = "nvimdev/indentmini.nvim"
on_event = ["BufWinEnter", "FileType", "TextChanged", "TextChangedI"]
on_if = "&buftype ==# '' && index(['help', 'markdown', 'text'], &filetype) < 0 && (line('$') > 1 || getline(1) !=# '')"
on_cmd = ["IndentToggle", "IndentEnable", "IndentDisable"]
lua_source = '''
    local indentmini_augroup = vim.api.nvim_create_augroup("__indentmini__", { clear = true })

    local function set_indentmini_highlights()
        local non_text = vim.api.nvim_get_hl(0, { name = "NonText" })
        local line_nr = vim.api.nvim_get_hl(0, { name = "LineNr" })
        vim.api.nvim_set_hl(0, "IndentLine", { fg = non_text.fg, nocombine = true })
        vim.api.nvim_set_hl(0, "IndentLineCurrent", { fg = line_nr.fg or non_text.fg, nocombine = true })
    end

    set_indentmini_highlights()
    vim.api.nvim_create_autocmd("ColorScheme", {
        group = indentmini_augroup,
        callback = set_indentmini_highlights,
    })

    require("indentmini").setup({
        char = "▏",
        minlevel = 1,
        only_current = false,
        exclude = { "help", "markdown", "text", "nofile", "nowrite", "acwrite", "prompt", "terminal", "quickfix" },
    })
'''

