[[plugins]]
repo = "catgoose/nvim-colorizer.lua"
lua_add = '''
    vim.g.colorizer_filetypes = {
        "css", "scss", "sass", "less", "html", "javascript", "javascriptreact",
        "typescript", "typescriptreact", "vue", "svelte", "astro", "lua", "vim",
        "json", "jsonc", "json5", "toml", "yaml", "conf", "dosini", "sh", "fish", "tmux",
    }
'''
on_event = ["BufWinEnter", "FileType", "TextChanged", "TextChangedI"]
on_if = "&buftype ==# '' && index(g:colorizer_filetypes, &filetype) >= 0 && (line('$') > 1 || getline(1) !=# '')"
on_cmd = ["ColorizerAttachToBuffer", "ColorizerDetachFromBuffer", "ColorizerReloadAllBuffers", "ColorizerToggle"]
lua_source = '''
    local colorizer = require("colorizer")
    local filetypes = vim.g.colorizer_filetypes
    colorizer.setup({
        filetypes = filetypes,
        buftypes = { "!nofile", "!nowrite", "!acwrite", "!prompt", "!terminal", "!quickfix", "!help" },
        lazy_load = true,
    })
    -- TextChanged can be the first trigger, without FileType or BufWinEnter to replay.
    local buf = vim.api.nvim_get_current_buf()
    vim.schedule(function()
        if vim.api.nvim_buf_is_loaded(buf) and vim.bo[buf].buftype == ""
            and vim.list_contains(filetypes, vim.bo[buf].filetype) then
            colorizer.attach_to_buffer(buf, nil, "filetype")
        end
    end)
'''

[[plugins]]
repo = "romus204/tree-sitter-manager.nvim"
on_lua = "tree-sitter-manager"
on_cmd = ["TSManager", "TSInstall", "TSInstallSync", "TSUninstall", "TSUpdate", "TSUpdateSync"]
lua_source = '''
    require("tree-sitter-manager").setup({
        highlight = false,
        ensure_installed = {
            "bash", "cpp", "dockerfile", "git_config", "git_rebase",
            "gitignore", "json", "json5", "make", "python", "rust",
            "ssh_config", "tmux", "typescript", "zig",
        },
        auto_install = false,
    })
'''

[[plugins]]
repo = "neovim/nvim-lspconfig"
on_ft = ["c", "cpp", "objc", "objcpp", "cuda", "lua", "python", "rust", "zig", "zir"]
# InsertEnter is too late for the initial LSP capabilities and progress notifications.
depends = ["ddc-source-lsp", "fidget.nvim"]
hooks_file = "$XDG_CONFIG_HOME/nvim/hooks/lsp.lua"

[[plugins]]
repo = "lewis6991/gitsigns.nvim"
# BufReadPost alone misses buffers first named with :file or :write.
on_event = ["BufReadPost", "BufNewFile", "BufFilePost", "BufWritePost"]
on_if = "&buftype ==# '' && expand('%:p') !=# ''"
on_cmd = "Gitsigns"
on_lua = "gitsigns"
lua_source = '''
    vim.api.nvim_set_hl(0, "GitSignsAddInline", { fg = nil, bg = "#003800" })
    vim.api.nvim_set_hl(0, "GitSignsChangeInline", { fg = nil, bg = "#404000" })
    vim.api.nvim_set_hl(0, "GitSignsDeleteInline", { fg = nil, bg = "#400000" })
    require("gitsigns").setup({
        signs = {
            add = { text = "┃+" },
            change = { text = "┃~" },
        },
        signs_staged = {
            add = { text = '┃+' },
            change = { text = "┃~" },
        },
        word_diff = true,
        numhl = true,
        current_line_blame = true,
    })
'''

lua_add = '''
    vim.keymap.set("n", "<leader>hp", function() require("gitsigns").preview_hunk() end, { desc = "Preview git hunk" })
'''
