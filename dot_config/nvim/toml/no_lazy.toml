[[plugins]]
repo = "sainnhe/everforest"
hook_add = '''
    let g:everforest_background = 'hard'
    colorscheme everforest
'''

[[plugins]]
repo = "romus204/tree-sitter-manager.nvim"
lua_source = '''
    require("tree-sitter-manager").setup({
        highlight = false,
        ensure_installed = {
            "bash", "cpp", "dockerfile", "git_config", "git_rebase",
            "gitignore", "json", "json5", "make", "python", "rust",
            "ssh_config", "tmux", "typescript", "zig",
        },
        auto_install = true,
        noauto_install = {
            "c", "lua", "markdown", "markdown_inline", "query", "vim", "vimdoc",
        },
    })
    vim.api.nvim_create_autocmd("FileType", {
        group = vim.api.nvim_create_augroup("__treesitter_highlight", { clear = true }),
        -- Work around suppressed BufReadPost when start() loads a buffer inside FileType.
        callback = vim.schedule_wrap(function(event)
            if vim.api.nvim_buf_is_loaded(event.buf) then
                pcall(vim.treesitter.start, event.buf)
            end
        end),
    })
'''

[[plugins]]
repo = "Shougo/ddc-source-lsp"
hooks_file = "$XDG_CONFIG_HOME/nvim/hooks/lsp.lua"

[[plugins]]
repo = "neovim/nvim-lspconfig"

[[plugins]]
repo = "xiyaowong/transparent.nvim"
lua_source = '''
    vim.api.nvim_set_hl(0, "NormalFloat", { fg = vim.api.nvim_get_hl(0, { name = "NormalFloat" }).fg, bg = nil })
    vim.api.nvim_set_hl(0, "FloatBorder", { fg = vim.api.nvim_get_hl(0, { name = "FloatBorder" }).fg, bg = nil })
    vim.api.nvim_set_hl(0, "FloatTitle", { fg = vim.api.nvim_get_hl(0, { name = "FloatTitle" }).fg, bg = nil })
'''

[[plugins]]
repo = "lewis6991/gitsigns.nvim"
# Gitsigns defers buffer work internally; the author advises against external lazy loading.
# https://github.com/lewis6991/gitsigns.nvim/issues/1289#issuecomment-2840371229
lua_source = '''
    vim.api.nvim_set_hl(0, "GitSignsAddInline", { fg = nil, bg = "#003800" })
    vim.api.nvim_set_hl(0, "GitSignsChangeInline", { fg = nil, bg = "#404000" })
    vim.api.nvim_set_hl(0, "GitSignsDeleteInline", { fg = nil, bg = "#400000" })
    require("gitsigns").setup({
        signs = {
            add = { text = "┃+" },
            change = { text = "┃~" },
        },
        signs_staged = {
            add = { text = '┃+' },
            change = { text = "┃~" },
        },
        word_diff = true,
        numhl = true,
        current_line_blame = true,
    })
    vim.keymap.set("n", "<leader>hp", require("gitsigns").preview_hunk, { desc = "Preview git hunk" })
'''
